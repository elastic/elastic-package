queue_rules:
  - name: default
    queue_conditions:
      - check-success=buildkite/elastic-package
      - check-success=CLA
      - base=main
      - or:
          - author~=^dependabot(|-preview)\[bot\]$
          - and:
              - author=github-actions[bot]
              - head~=^updatecli_
    merge_conditions:
      - check-success=buildkite/elastic-package
    merge_method: squash

pull_request_rules:
  - name: automatic approval for Dependabot pull requests
    conditions:
      - author~=^dependabot(|-preview)\[bot\]$
    actions:
      review:
        type: APPROVE
        message: Automatically approving dependabot
  - name: automatic approval for updatecli pull requests
    conditions:
      - author=github-actions[bot]
      - head~=^updatecli_
    actions:
      review:
        type: APPROVE
        message: Automatically approving updatecli
  - name: automatic merge of bot 🤖
    conditions: []
    actions:
      queue:
        name: default
