retry":{"max-attempts":3,"delay":"5s"}},"with":{"ids":"${{ variables.auto_close_ids }}","tags":{"tags_to_remove":[],"tags_to_add":["{{variables.tag_prefix}}.{{consts.closed_tag_suffix}}"]}}},{"name":"close_alerts_as_false_positive","type":"kibana.SetAlertsStatus","on-failure":{"retry":{"max-attempts":3,"delay":"5s"}},"with":{"status":"closed","reason":"false_positive","conflicts":"proceed","query":{"bool":{"filter":{"terms":{"_id":"${{ variables.auto_close_ids }}"}}}}}}]},{"name":"log_batch_summary","type":"console","with":{"message":"Alert analysis finished for rule {{ variables.rule_name }}: {{ variables.all_verdicts | size }} verdicts for {{ variables.pending_alert_count }} alerts in {{ variables.batch_llm_calls }} model call(s); {{ variables.auto_close_ids.size }} alert{% if variables.auto_close_ids.size != 1 %}s{% endif %} matched the auto-close thresholds."}}],"else":[{"name":"set_missing_alert_ids_on_skip","type":"data.set","if":"${{ inputs.calledByWorker == true }}","with":{"missing_alert_ids":"${{ inputs.alerts | reject_exp: ''a'', variables.pending_filter_expr | map: ''_id'' }}"}}]},{"name":"emit_workflow_output","type":"workflow.output","status":"completed","with":{"verdicts":"${{ variables.output_verdicts }}","false_positive_count":"${{ variables.output_verdicts | where: ''classification'', ''false_positive'' | size }}","true_positive_count":"${{ variables.output_verdicts | where: ''classification'', ''true_positive'' | size }}","inconclusive_count":"${{ variables.output_verdicts | where: ''classification'', ''inconclusive'' | size }}","auto_closed_ids":"${{ variables.auto_close_ids }}","grouped_counts_summary":"{{ variables.grouped_counts_summary }}","generated_summary":"{{ variables.generated_summary }}","connector_id":"{{ variables.resolved_connector_id }}","agent_id":"{% if variables.use_prompt == true %}{% else %}{{ variables.agent_id }}{% endif %}","impacted_entities":"${{ variables.impacted_entities }}","missing_alert_ids":"${{ variables.missing_alert_ids }}"}}],"triggers":[{"type":"alert"},{"type":"manual","inputs":{"properties":{"alerts":{"description":"Alert documents to analyse, supplied by a `workflow.execute` caller such as the AlertZero Alert Triage Worker. A child run receives no trigger event, so without this the workflow would see zero alerts. When `calledByWorker` is true, a missing or empty `alerts` array fails the run (workflow.fail) instead of completing with empty output. Absent on the standalone path, which keeps reading the alert trigger''s own `event.alerts`. Bounded to 1000 items; each item must include `_id`, `_index` (Security alerts alias or backing index for related-alert graph lookup), `@timestamp`, and `kibana.alert.rule.uuid` (writebacks, enrichment date-range anchor, and rule-context derivation). Execution still chunks by consts.batch_size.\n","$ref":"#/kibana/definitions/securityAlertAnalysisCallerAlerts"},"autoCloseEnabled":{"type":"boolean","description":"When provided, overrides the space''s uiSettings autoCloseEnabled value. The Worker sets this to false because it owns closing via proposals. When `calledByWorker` is true and this field is omitted, the sub-workflow forces auto-close off so HITL cannot be bypassed by accident.\n"},"autoCloseConfidenceScoreMinThreshold":{"type":"number","description":"Minimum confidence score for FP auto-close. Overrides the uiSettings value. When supplied, the max threshold is collapsed to 1 (range becomes a floor). Bounded to 0–1 to match the uiSettings contract.\n","minimum":0,"maximum":1},"tagPrefix":{"type":"string","description":"Tag prefix for workflow tags. Overrides the uiSettings tagPrefix. Same length/pattern constraints as the uiSettings value (interpolated into filter expressions).\n","maxLength":256,"pattern":"^(?=.*[a-zA-Z0-9])[a-zA-Z0-9._-]+$"},"connectorIdByFeature":{"type":"string","description":"Model Management feature id used to resolve the LLM connector at run time. Mutually exclusive with the uiSettings-derived connectorId: supplying this tells the sub-workflow to use the feature registry instead of uiSettings. Must be non-empty — an empty string passes the != null gate but leaves both connectors unset, causing analysis to silently skip with empty verdicts. Bounded to 255 chars to match other Kibana featureId request bounds; interpolated into every batch''s connector lookup.\n","minLength":1,"maxLength":255},"calledByWorker":{"type":"boolean","description":"Explicit flag that this run was triggered by an AlertZero Worker via workflow.execute (not by the alert trigger directly). When true, Worker-specific steps activate: input overrides, caller-supplied alerts, and output accumulation. Absent (or false) keeps the standalone (alert-trigger) path unchanged. Each batch is then classified with one `ai.prompt` call, never an `ai.agent` run: the prompt is self-contained, so the agent adds only its framework prompt and extra model calls. The standalone path follows the space''s \"use a prompt\" setting instead.\n"},"investigationConversationId":{"type":"string","description":"Conversation id of an existing Investigation conversation (created by the Worker before calling this sub-workflow). When supplied and calledByWorker is true, progress comments are posted into that conversation via `ai.conversation.add_user_message` so the analyst sees batch-by-batch results without leaving the Investigation. Absent on the standalone path — no comments are posted. Bounded to 1–256 chars to match Agent Builder CONVERSATION_ID_MAX_LENGTH.\n","minLength":1,"maxLength":256},"authorName":{"type":"string","description":"Display name for the progress comments posted into the Investigation when the Worker runs as a service account, e.g. \"Alert Triage worker\". Temporary until service accounts carry a display name. Defaults to this workflow''s name.\n","minLength":1,"maxLength":256}},"additionalProperties":false}}]},"createdBy":"elastic/kibana","lastUpdatedBy":"elastic/kibana","valid":true,"createdAt":"2026-10-27T10:52:16.605Z","lastUpdatedAt":"2026-10-27T10:52:16.605Z","version":1,"history":[],"permissions":{"read":true,"execute":true,"edit":true,"manage":true}},{"id":"system-attack-discovery-alert-retrieval","name":"Security - Attack discovery - Default alert retrieval","description":"Retrieves alerts for Attack Discovery analysis via custom queries, or ES|QL.\nThis is the DEFAULT alert retrieval workflow - for custom alert retrieval, create your own workflow.\n","enabled":true,"tags":["attack-discovery","security","attackDiscovery:default_alert_retrieval"],"managed":true,"managedBy":"discoveries","definitionHash":"1ab8e622d7dd6287788a289f6bdc9facde7a1245d4a06d7718e5c70a091172f8","originManagedWorkflowId":"system-attack-discovery-alert-retrieval","managedVersion":2,"lifecycle":"static","yaml":"version: ''1''\nname: Security - Attack discovery - Default alert retrieval\ndescription: |\n  Retrieves alerts for Attack Discovery analysis via custom queries, or ES|QL.\n  This is the DEFAULT alert retrieval workflow - for custom alert retrieval, create your own workflow.\nenabled: true\ntags:\n  - attack-discovery\n  - security\n  - attackDiscovery:default_alert_retrieval\n\ntriggers:\n  - type: manual\n    inputs:\n      additionalProperties: false\n      properties:\n        alerts_index_pattern:\n          description: >\n            Elasticsearch index pattern for security alerts. When not provided,\n            defaults to .alerts-security.alerts-<spaceId> using the current\n            Kibana space (via workflow.spaceId).\n          type: string\n        anonymization_fields:\n          description: Fields to anonymize\n          items:\n            additionalProperties: true\n            type: object\n          type: array\n        api_config:\n          additionalProperties: false\n          description: LLM API configuration\n          properties:\n            action_type_id:\n              type: string\n            connector_id:\n              type: string\n            model:\n              type: string\n          required:\n            - connector_id\n          type: object\n        end:\n          description: Time range end\n          type: string\n        esql_query:\n          description: >\n            Optional ES|QL query for alert retrieval. When provided, overrides the\n            default DSL-based retrieval and executes this ES|QL query instead.\n          type: string\n        filter:\n          additionalProperties: true\n          description: Query filter for alerts\n          type: object\n        replacements:\n          additionalProperties: true\n          description: Existing anonymization replacements to use\n          type: object\n        size:\n          default: 150\n          description: Maximum alerts to retrieve\n          type: integer\n        start:\n          description: Time range start\n          type: string\n      required:\n        - anonymization_fields\n        - api_config\n\nsteps:\n  - name: retrieve_alerts\n    type: security.attack-discovery.defaultAlertRetrieval\n    timeout: ''5m''\n    with:\n      alerts_index_pattern: ''{%- if inputs.alerts_index_pattern -%}{{ inputs.alerts_index_pattern }}{%- else -%}.alerts-security.alerts-{{ workflow.spaceId }}{%- endif -%}''\n      anonymization_fields: ${{ inputs.anonymization_fields }}\n      api_config: ${{ inputs.api_config }}\n      end: ${{ inputs.end }}\n      esql_query: ${{ inputs.esql_query }}\n      filter: ${{ inputs.filter }}\n      replacements: ${{ inputs.replacements }}\n      size: ${{ inputs.size }}\n      start: ${{ inputs.start }}\n","definition":{"version":"1","name":"Security - Attack discovery - Default alert retrieval","description":"Retrieves alerts for Attack Discovery analysis via custom queries, or ES|QL.\nThis is the DEFAULT alert retrieval workflow - for custom alert retrieval, create your own workflow.\n","enabled":true,"tags":["attack-discovery","security","attackDiscovery:default_alert_retrieval"],"steps":[{"name":"retrieve_alerts","type":"security.attack-discovery.defaultAlertRetrieval","timeout":"5m","with":{"alerts_index_pattern":"{%- if inputs.alerts_index_pattern -%}{{ inputs.alerts_index_pattern }}{%- else -%}.alerts-security.alerts-{{ workflow.spaceId }}{%- endif -%}","anonymization_fields":"${{ inputs.anonymization_fields }}","api_config":"${{ inputs.api_config }}","end":"${{ inputs.end }}","esql_query":"${{ inputs.esql_query }}","filter":"${{ inputs.filter }}","replacements":"${{ inputs.replacements }}","size":"${{ inputs.size }}","start":"${{ inputs.start }}"}}],"triggers":[{"type":"manual","inputs":{"properties":{"alerts_index_pattern":{"type":"string","description":"Elasticsearch index pattern for security alerts. When not provided, defaults to .alerts-security.alerts-<spaceId> using the current Kibana space (via workflow.spaceId).\n"},"anonymization_fields":{"type":"array","description":"Fields to anonymize","items":{"type":"object","additionalProperties":true}},"api_config":{"type":"object","description":"LLM API configuration","properties":{"action_type_id":{"type":"string"},"connector_id":{"type":"string"},"model":{"type":"string"}},"additionalProperties":false,"required":["connector_id"]},"end":{"type":"string","description":"Time range end"},"esql_query":{"type":"string","description":"Optional ES|QL query for alert retrieval. When provided, overrides the default DSL-based retrieval and executes this ES|QL query instead.\n"},"filter":{"type":"object","description":"Query filter for alerts","additionalProperties":true},"replacements":{"type":"object","description":"Existing anonymization replacements to use","additionalProperties":true},"size":{"type":"integer","description":"Maximum alerts to retrieve","default":150},"start":{"type":"string","description":"Time range start"}},"additionalProperties":false,"required":["anonymization_fields","api_config"]}}]},"createdBy":"elastic/kibana","lastUpdatedBy":"elastic/kibana","valid":true,"createdAt":"2026-10-27T10:52:16.605Z","lastUpdatedAt":"2026-10-27T10:52:16.605Z","version":1,"history":[],"permissions":{"read":true,"execute":true,"edit":true,"manage":true}},{"id":"system-datadog-alert-translation","name":"Datadog alert translation","description":"Creates and recovers Elastic alerts from Datadog monitor webhook events.","enabled":true,"tags":[],"managed":true,"managedBy":"alertingVTwo","definitionHash":"b9b5135a6867ec3fa14001abec7302ed89afd3160bf60120d2eb847a1cffae94","originManagedWorkflowId":"system-datadog-alert-translation","managedVersion":1,"lifecycle":"static","yaml":"name: Datadog alert translation\ndescription: Creates and recovers Elastic alerts from Datadog monitor webhook events.\nenabled: true\ntriggers:\n  - type: datadog.alert\n    connector-id: \"*\"\nsteps:\n  - name: create_datadog_alert\n    type: alerting.create_alert\n    with:\n      source: datadog\n      fingerprint: \"{{ event.body.monitor_id }}:{{ event.body.scopes }}\"\n      alert_status: ''{% assign transition_prefix = event.body.alert_transition | slice: 0, 9 %}{% if transition_prefix == \"Recovered\" %}inactive{% else %}active{% endif %}''\n      data:\n        rule_name: \"{{ event.body.title }}\"\n        monitor_id: \"{{ event.body.monitor_id }}\"\n        transition: \"{{ event.body.alert_transition }}\"\n        message: \"{{ event.body.message }}\"\n        alert_url: \"{{ event.body.url }}\"\n        priority: \"{{ event.body.severity }}\"\n        tags: \"{{ event.body.tags }}\"\n        alert_type: \"{{ event.body.alert_type }}\"\n        alert_query: \"{{ event.body.alert_query }}\"\n        event_type: \"{{ event.body.event_type }}\"\n        scopes: \"{{ event.body.scopes }}\"\n        event_id: \"{{ event.body.id }}\"\n    on-failure:\n      continue: true\n","definition":{"version":"1","name":"Datadog alert translation","description":"Creates and recovers Elastic alerts from Datadog monitor webhook events.","enabled":true,"steps":[{"name":"create_datadog_alert","type":"alerting.create_alert","with":{"source":"datadog","fingerprint":"{{ event.body.monitor_id }}:{{ event.body.scopes }}","alert_status":"{% assign transition_prefix = event.body.alert_transition | slice: 0, 9 %}{% if transition_prefix == \"Recovered\" %}inactive{% else %}active{% endif %}","data":{"rule_name":"{{ event.body.title }}","monitor_id":"{{ event.body.monitor_id }}","transition":"{{ event.body.alert_transition }}","message":"{{ event.body.message }}","alert_url":"{{ event.body.url }}","priority":"{{ event.body.severity }}","tags":"{{ event.body.tags }}","alert_type":"{{ event.body.alert_type }}","alert_query":"{{ event.body.alert_query }}","event_type":"{{ event.body.event_type }}","scopes":"{{ event.body.scopes }}","event_id":"{{ event.body.id }}"}},"on-failure":{"continue":true}}],"triggers":[{"type":"datadog.alert","connector-id":"*"}]},"createdBy":"elastic/kibana","lastUpdatedBy":"elastic/kibana","valid":true,"createdAt":"2026-10-27T10:52:16.593Z","lastUpdatedAt":"2026-10-27T10:52:16.593Z","version":1,"history":[],"permissions":{"read":true,"execute":true,"edit":true,"manage":true}},{"id":"system-nightshift-investigation","name":"Nightshift Investigation","description":"General-purpose root cause investigation. One agent investigates available signals, including logs, traces, metrics, and topology, then produces a structured conclusion.\n","enabled":true,"tags":["observability","investigation","nightshift"],"managed":true,"managedBy":"nightshiftInvestigations","definitionHash":"8e300e9ada8e63b973006b57b9c13b3f2a2e149c336530d951777090489dc531","originManagedWorkflowId":"system-nightshift-investigation","managedVersion":4,"lifecycle":"static","yaml":"version: ''1''\nname: Nightshift Investigation\ndescription: >\n  General-purpose root cause investigation. One agent investigates available signals,\n  including logs, traces, metrics, and topology, then produces a structured conclusion.\nenabled: true\nsettings:\n  timeout: ''60m''\n  # Fallbacks run after ordinary step errors, not after workflow timeout or cancellation.\n  on-failure:\n    fallback:\n      - name: handle_investigation_failure\n        type: nightshift.handleInvestigationFailure\n        with:\n          investigation_id: ''{{ inputs.investigation_id | default: execution.id }}''\n          # The failed steps remain available even when the engine omits the fallback''s error binding.\n          reason: >-\n            ${{ error.message\n            | default: steps.resolve_model.error.message\n            | default: steps.ensure_investigation_agent.error.message\n            | default: steps.persist_investigation_started.error.message\n            | default: steps.resolve_investigation_sources.error.message\n            | default: steps.investigate.error.message\n            | default: ''Investigation failed'' | truncate: 10000 }}\n        on-failure:\n          continue: true\n  # One run per investigation at a time, in arrival order, so a follow-up builds on the run\n  # before it.\n  concurrency:\n    key: ''investigation:{{ inputs.investigation_id | default: execution.id }}''\n    strategy: queue\n    max: 1\ntags:\n  - observability\n  - investigation\n  - nightshift\n\ntriggers:\n  - type: manual\n    inputs:\n      properties:\n        message:\n          type: string\n          description: Description of the issue or event to investigate.\n        title:\n          type: string\n          maxLength: 512\n          description: >\n            Accepted for compatibility and not stored. Agent Builder generates the investigation''s\n            title from its first round.\n        source_ids:\n          type: array\n          maxItems: 100\n          items:\n            type: string\n            maxLength: 255\n          description: >\n            Optional Nightshift source ids to scope observability queries. The workflow resolves\n            them to slug and ES|QL view for the investigator.\n        context:\n          type: object\n          additionalProperties: true\n          description: Optional structured context from the start API.\n        connector_id:\n          type: string\n          maxLength: 500\n          description: Optional chat model connector or inference endpoint id for this run.\n        subjects:\n          type: array\n          maxItems: 50\n          items:\n            type: object\n            additionalProperties: true\n          description: >\n            Subjects to record on the investigation (alerts, significant events, questions), as\n            the start API passes them. Without it the subject is derived from the context.\n        notificationDestinations:\n          type: array\n          maxItems: 5\n          description: Destinations that receive investigation lifecycle messages.\n          items:\n            type: object\n            additionalProperties: false\n            required:\n              - type\n              - connector_id\n              - params\n            properties:\n              type:\n                type: string\n                minLength: 1\n                maxLength: 100\n              connector_id:\n                type: string\n                minLength: 1\n                maxLength: 500\n              params:\n                type: object\n                additionalProperties: true\n                description: Connector-specific destination properties, validated by the notification handler at runtime. Limited to 4096 JSON characters, three container levels, and 20 entries per object or array.\n              automation_id:\n                type: string\n                maxLength: 500\n              automation_name:\n                type: string\n                maxLength: 500\n        investigation_id:\n          type: string\n          description: >\n            The investigation (Agent Builder conversation) to run in. The start API always sets\n            it; a run without it starts a new investigation whose id is the workflow execution ID.\n      required:\n        - message\n      additionalProperties: false\n\nsteps:\n  # Resolve before any persisted state or lifecycle event, so a bad or blocked model cannot leave\n  # a stale started investigation.\n  - name: resolve_model\n    type: nightshift.resolveModel\n    with:\n      step: investigation\n      connector_id: ''{{ inputs.connector_id }}''\n\n  # Investigation agents are per-space documents. Ensuring the agent here covers direct and manual\n  # workflow executions as well as client starts; it is idempotent and preserves existing edits.\n  # It runs before persistence and lifecycle emission so an unavailable agent leaves no stale run.\n  - name: ensure_investigation_agent\n    type: nightshift.ensureInvestigationAgent\n    with:\n      agent_id: nightshift.investigation\n\n  # Gets or creates the investigation conversation and records the run''s subjects before lifecycle\n  # emission, so a running investigation is always visible, and records this run''s execution id so\n  # the investigation reads as in progress while it runs. The server derives everything from the\n  # execution document; retries cover startup races. A run continuing a closed investigation\n  # reopens it.\n  - name: persist_investigation_started\n    type: kibana.request\n    with:\n      method: POST\n      path: ''/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/_ensure''\n      headers:\n        x-elastic-internal-origin: ''kibana''\n      body:\n        execution_id: ''{{ execution.id }}''\n    on-failure:\n      retry:\n        max-attempts: 3\n        delay: 5s\n        strategy: exponential\n      # Step-level retries override the workflow-level fallback.\n      fallback:\n        - name: handle_persistence_failure\n          type: nightshift.handleInvestigationFailure\n          with:\n            investigation_id: ''{{ inputs.investigation_id | default: execution.id }}''\n            reason: \"${{ steps.persist_investigation_started.error.message | default: ''Investigation failed'' | truncate: 10000 }}\"\n          on-failure:\n            continue: true\n\n  - name: emit_investigation_started\n    type: kibana.request\n    with:\n      method: POST\n      path: ''/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/lifecycle_events''\n      headers:\n        x-elastic-internal-origin: ''kibana''\n      body:\n        status: ''running''\n    on-failure:\n      continue: true\n\n  - name: notify_started\n    type: nightshift.sendNotifications\n    with:\n      investigation_id: ''{{ inputs.investigation_id | default: execution.id }}''\n      phase: started\n    on-failure:\n      continue: true\n\n  # Resolves the requested source ids to their slug and ES|QL view in one request. A failed request\n  # leaves the list empty: a missing source list must not block the investigation.\n  - name: list_investigation_sources\n    type: kibana.request\n    if: ''${{ (inputs.source_ids | size | default: 0) > 0 }}''\n    with:\n      method: GET\n      path: ''/s/{{ workflow.spaceId }}/internal/nightshift/sources?per_page=100&{% for id in inputs.source_ids %}ids={{ id | url_encode }}{% unless forloop.last %}&{% endunless %}{% endfor %}''\n      headers:\n        x-elastic-internal-origin: ''kibana''\n    on-failure:\n      continue: true\n\n  - name: resolve_investigation_sources\n    type: data.set\n    with:\n      investigation_sources: ''${{ steps.list_investigation_sources.output.sources | default: [] }}''\n\n  - name: investigate\n    type: ai.agent\n    agent-id: nightshift.investigation\n    connector-id: ''{{ steps.resolve_model.output.connector_id }}''\n    plugin-id: ''nightshift_investigation''\n    aggregate-by: ''nightshift''\n    product-solution: ''observability''\n    product-feature: ''nightshift''\n    timeout: 1800s\n    with:\n      # The agent records its findings on the investigation with its tools, so the step has no\n      # output schema.\n      conversation_id: ''${{ steps.persist_investigation_started.output.conversation_id }}''\n      message: |\n        {{ inputs.message }}\n\n        {% if variables.investigation_sources and variables.investigation_sources.size > 0 %}\n        Related sources:\n        {% for source in variables.investigation_sources %}- {{ source.slug }} (id {{ source.id }}): FROM {{ source.view_name }}\n        {% endfor %}\n        {% elsif inputs.source_ids and inputs.source_ids.size > 0 %}\n        Related sources: none of the requested sources could be resolved to an ES|QL view. The source list was unavailable or the sources no longer exist, so no source scope applies.\n        {% endif %}\n\n        {% if inputs.context and inputs.context.size > 0 and inputs.context.source != ''alert'' %}\n        Additional context: {{ inputs.context | json }}\n        {% endif %}\n\n  - name: emit_investigation_completed\n    type: kibana.request\n    with:\n      method: POST\n      path: ''/s/{{ workflow.spaceId }}/internal/nightshift/investigations/{{ inputs.investigation_id | default: execution.id }}/lifecycle_events''\n      headers:\n        x-elastic-internal-origin: ''kibana''\n      body:\n        status: ''completed''\n    on-failure:\n      continue: true\n\n  - name: notify_completed\n    type: nightshift.sendNotifications\n    with:\n      investigation_id: ''{{ inputs.investigation_id | default: execution.id }}''\n      phase: completed\n    on-failure:\n      continue: true\n","definition":{"version":"1","name":"Nightshift Investigation","description":"General-purpose root cause investigation. One agent investigates available signals, including logs, traces, metrics, and topology, then produces a structured conclusion.\n","settings":{"timeout":"60m","on-failure":{"fallback":[{"name":"handle_investigation_failure","type":"nightshift.handleInvestigationFailure","with":{"investigation_id":"{{ inputs.investigation_id | 