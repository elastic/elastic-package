format_version: 3.2.1
name: readme_ilm_input
title: "Readme ILM Input"
version: 0.0.1
source:
  license: "Elastic-2.0"
description: "Tests README rendering with a root lifecycle.yml in an input package."
type: input
categories:
  - custom
conditions:
  kibana:
    version: "^8.15.0"
  elastic:
    subscription: "basic"
policy_templates:
  - name: readme_ilm_input
    type: logs
    title: Readme ILM Input
    description: Test policy template for README ILM input package.
    input: logfile
    template_path: input.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        multi: true
        required: true
        show_user: true
        default:
          - /var/log/*.log
owner:
  github: elastic/ecosystem
  type: elastic
