---
name: Run updatecli

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1-5'   # daily: all pipelines except terraform/gcloud
    - cron: '0 2 1,15 * *'  # biweekly (1st and 15th): terraform and gcloud only
  pull_request:
    paths:
      - .github/workflows/updatecli/**
      - .github/workflows/run-updatecli.yml

permissions:
  contents: read

jobs:
  updatecli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Select diff action
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "UPDATECLI_ACTION=diff" >> $GITHUB_ENV

      - name: Select apply action
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "UPDATECLI_ACTION=apply" >> $GITHUB_ENV

      - name: Select config
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '0 1 * * 1-5')
              cfg='--config .github/workflows/updatecli/updatecli.d'
              ;;
            '0 2 1,15 * *')
              cfg='--config .github/workflows/updatecli/biweekly.d'
              ;;
            *)
              # PR diff or workflow_dispatch: run all pipelines
              cfg='--config .github/workflows/updatecli/updatecli.d --config .github/workflows/updatecli/biweekly.d'
              ;;
          esac
          echo "UPDATECLI_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7 #v3.7.0

      - name: Run updatecli
        # --experimental needed for commitusingapi option.
        run: updatecli --experimental ${{ env.UPDATECLI_ACTION }} ${{ env.UPDATECLI_CONFIG }} --values .github/workflows/updatecli/values.d/scm.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
